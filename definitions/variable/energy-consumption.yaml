- Final Energy:
    description: Final energy consumption by all end-use sectors and all fuels
      including ambient heat, geothermal and solar thermal energy,
      excluding transmission/distribution losses
    unit: TJ
- Final Energy [by Carrier]|{Final Energy Carrier}:
    description: Consumption of {Final Energy Carrier}
      excluding transmission/distribution losses
    unit: TJ
- Final Energy [by Sector]|{Sector}:
    description: Energy consumption by the {Sector}
      excluding transmission/distribution losses
    unit: TJ
- Final Energy [by Sector]|{Sector}|{Final Energy Carrier}:
    description: Energy consumption of {Final Energy Carrier} by the {Sector}
      excluding transmission/distribution losses
    unit: TJ

# aggregate categories where detailed reporting is not possible
- Final Energy [by Sector]|Residential and Commercial|Residential:
    description: Energy consumption in the residential sector (buildings and households)
      excluding transmission/distribution losses
    unit: TJ
- Final Energy [by Sector]|Residential and Commercial|Commercial and Institutional:
    description: Energy consumption in the commercial and institutional sector (services)
      excluding transmission/distribution losses
    unit: TJ
